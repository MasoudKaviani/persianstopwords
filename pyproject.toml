[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-stopwords"
version = "1.0.0"
description = "A comprehensive, curated list of Persian (Farsi) stopwords for text processing and NLP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Masoud Kaviani", email = "kavianimd@gmail.com" },
]
keywords = [
    "persian",
    "farsi",
    "stopwords",
    "nlp",
    "text-processing",
    "corpus",
    "iranian",
    "persian-language",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/mkavianimd/persian-stopwords"
Repository = "https://github.com/mkavianimd/persian-stopwords"
Issues = "https://github.com/mkavianimd/persian-stopwords/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persian_stopwords = ["data/*.txt"]
